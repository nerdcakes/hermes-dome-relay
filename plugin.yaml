# Design-stage native manifest. Still NOT a loadable plugin until the root
# __init__.py implements register(ctx). Implemented registrations are empty.
name: dome-relay
version: "0.1.0"
manifest_version: 2
description: Structured escalation briefs and handoffs between established agents.
author: Team Astrum (nerdcakes)
license: MIT
homepage: https://github.com/nerdcakes/hermes-dome-relay
tags: [automation, escalation]
provides_tools: []
provides_hooks: []
capabilities: []
config_schema:
  # The Grok routine URL and key are Fly secrets on the relay process only
  # (DOME_RELAY_GROK_WEBHOOK_URL and DOME_RELAY_GROK_KEY). This plugin must
  # not declare them, read them, or wake Grok.
  relay_url:
    type: str
    default: ""
    description: Approved HTTPS callback relay origin; no credentials in URLs.
  callback_host:
    type: str
    default: ""
    description: Exact allowlisted relay hostname.
  relay_key:
    type: secret
    env: DOME_RELAY_KEY
    description: Plugin registration and result-consumer key. Not the executive callback key and not the Grok wake key.
  max_attempts:
    type: int
    default: 3
  target_concurrency:
    type: int
    default: 1
# Add requires_hermes only after testing a released baseline.
# Add implemented tool/hook declarations together with their registrations.
